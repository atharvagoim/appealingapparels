<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Appealing Apparels — spacious, durable bags designed to go everywhere. Totes, slings, hobo bags and more, built for daily carry."
    />
    <title>Appealing Apparels — Bags Designed To Go Everywhere</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://appealingapparels.vercel.app/" />

    <!--
      Open Graph / Twitter Card — these are what WhatsApp, Facebook, Twitter
      and iMessage read for link previews. Unlike the <title> and
      meta[name=description] above (which JS updates per page), link-preview
      bots don't run JavaScript, so these stay fixed site-wide rather than
      changing per product. A per-product preview (showing that bag's own
      photo and price when a product link is shared) would need server-side
      rendering — a bigger change than this pass covers.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Appealing Apparels" />
    <meta property="og:title" content="Appealing Apparels — Bags Designed To Go Everywhere" />
    <meta
      property="og:description"
      content="Spacious, durable bags designed to go everywhere. Totes, slings, hobo bags and more, built for daily carry."
    />
    <meta property="og:image" content="https://appealingapparels.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://appealingapparels.vercel.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Appealing Apparels — Bags Designed To Go Everywhere" />
    <meta
      name="twitter:description"
      content="Spacious, durable bags designed to go everywhere. Totes, slings, hobo bags and more, built for daily carry."
    />
    <meta name="twitter:image" content="https://appealingapparels.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo: a broad grotesk that holds up at heavy weights and in the
         all-caps headings the new look leans on. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- JetBrains Mono: used specifically for numbers — prices, quantities,
         stats — not body text in general. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
